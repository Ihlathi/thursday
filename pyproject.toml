[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-accessibility-agent"
version = "0.1.0"
description = "Local intelligence core for an accessible computer agent"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<16", "jsonschema>=4.23,<5", "httpx>=0.28,<1", "google-genai>=1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
access-agent = "agent.cli:main"

[tool.setuptools]
package-dir = {"" = "core"}
packages = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["core", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
